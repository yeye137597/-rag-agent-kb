services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-agent-kb-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./hf_cache:/app/.cache/huggingface
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-agent-kb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
